spring.application.name=adaptive-teaching-planner
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adaptive_teaching_planner?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}

app.auth.jwt-secret-base64=${JWT_SECRET_BASE64:}
app.auth.otp-hash-secret-base64=${OTP_HASH_SECRET_BASE64:}
app.auth.issuer=${JWT_ISSUER:adaptive-teaching-planner}
app.auth.audience=${JWT_AUDIENCE:adaptive-teaching-planner-teachers}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.session-duration=PT168H
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.email.enabled=${MAIL_ENABLED:false}
app.email.from=${MAIL_FROM:Adaptive Teaching Planner <no-reply@localhost>}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
